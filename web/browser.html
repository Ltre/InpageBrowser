{{define "browser.html"}}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>InpageBrowser</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}.shell{height:100%;display:grid;grid-template-rows:52px 1fr}.toolbar{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid #dfe3e8;background:#f7f8fa}form{width:100%}input{width:100%;height:38px;border:1px solid #cfd4da;border-radius:19px;background:#fff;padding:0 17px;font-size:15px;outline:none}input:focus{border-color:#6b84e8;box-shadow:0 0 0 3px #6b84e820}input:disabled{background:#f2f3f5;color:#666}.viewport{min-height:0;background:#fff}.viewport iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style></head><body><div class="shell"><div class="toolbar"><form id="address-form"><input id="address" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="输入网址或搜索内容"></form></div><div class="viewport"><iframe id="browser-frame" title="Remote Chromium" allow="clipboard-read; clipboard-write" referrerpolicy="same-origin"></iframe></div></div><script src="/static/app.js"></script></body></html>{{end}}
