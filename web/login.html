{{define "login.html"}}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InpageBrowser 登录</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;color:#171717}.box{width:min(420px,calc(100% - 32px));margin:12vh auto;background:#fff;border:1px solid #e3e6ea;border-radius:16px;padding:28px;box-shadow:0 12px 40px #0000000d}h1{font-size:24px;margin:0 0 8px}.muted{color:#73777f;margin:0 0 22px}input{width:100%;height:48px;border:1px solid #cfd4da;border-radius:10px;padding:0 13px;font-size:17px;outline:none}input:focus{border-color:#4d73ff;box-shadow:0 0 0 3px #4d73ff20}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{height:44px;border:0;border-radius:10px;font-weight:700;cursor:pointer}#login{background:#111;color:#fff}#register{background:#edf0f4;color:#222}.err{min-height:22px;color:#b42318;margin-top:16px;font-size:13px}</style></head><body><main class="box"><h1>InpageBrowser</h1><p class="muted">手机号标识身份，Passkey 完成注册和登录。</p><input id="phone" inputmode="tel" autocomplete="tel" placeholder="手机号，例如 13800138000"><div class="actions"><button id="login">Passkey 登录</button><button id="register">首次注册</button></div><div id="error" class="err"></div></main><script src="/static/app.js"></script></body></html>{{end}}
